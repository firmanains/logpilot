version: '3.8'

networks:
  logpilot:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  grafana_data:

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: logpilot-kafka
    ports:
      - "9092:9092"
    environment:
      # Use KRaft mode by assigning both broker and controller roles
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'

      # Networking and Listeners
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'

      # Internal KRaft metadata logs
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    networks:
      - logpilot


  redis:
    image: redis:7-alpine
    container_name: logpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - logpilot

  postgres:
    image: postgres:15-alpine
    container_name: logpilot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpilot123}
      POSTGRES_DB: ${POSTGRES_DB:-logpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logpilot

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: logpilot-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - logpilot
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  grafana:
    image: grafana/grafana:10.2.0
    container_name: logpilot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - logpilot

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: logpilot-alertmanager
    ports:
      - "9094:9093"
    volumes:
      - ../../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logpilot
